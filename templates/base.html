<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>{% block title %}Konundrum{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#08090d; --bg2:#0d1018; --bg3:#111520;
      --border:#1a2535; --border2:#243040;
      --green:#00ff88; --blue:#00b4ff; --yellow:#ffb400; --red:#ff4455;
      --dim:#3a5a7a; --text:#c0cedd; --text-dim:#5a7a9a;
      --mono:'Share Tech Mono',monospace; --sans:'Rajdhani',sans-serif;
    }
    html { font-size:15px; }
    body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; }
    a { color:var(--blue); text-decoration:none; }
    a:hover { text-decoration:underline; }

    .site-header {
      border-bottom:1px solid var(--border); padding:0 1.5rem; height:54px;
      display:flex; align-items:center; justify-content:space-between;
      background:rgba(8,9,13,.97); position:sticky; top:0; z-index:100;
    }
    .logo { font-family:var(--mono); font-size:20px; letter-spacing:3px; text-decoration:none; }
    .logo:hover { text-decoration:none; }
    .logo .k { color:var(--green); } .logo .rest { color:var(--blue); }
    .nav { display:flex; align-items:center; gap:1.25rem; font-size:13px; font-family:var(--mono); }
    .nav a { color:var(--text-dim); letter-spacing:1px; transition:color .15s; }
    .nav a:hover { color:var(--text); text-decoration:none; }
    .nav a.active { color:var(--text); }
    .admin-badge { color:var(--yellow) !important; border:1px solid rgba(255,180,0,.4); padding:2px 8px; border-radius:3px; font-size:11px; }
    .btn-logout { background:none; border:1px solid var(--border); color:var(--text-dim); padding:4px 12px; border-radius:4px; cursor:pointer; font-family:var(--sans); font-size:13px; transition:all .2s; }
    .btn-logout:hover { border-color:var(--red); color:var(--red); }

    .page { max-width:960px; margin:0 auto; padding:2rem; }
    .page-sm { max-width:640px; margin:0 auto; padding:2rem; }
    .page-title { font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; margin-bottom:1.5rem; }
    .card { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:1.5rem; }

    .field { margin-bottom:1rem; }
    .field label { display:block; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); margin-bottom:5px; font-family:var(--mono); }
    .field input,.field textarea,.field select {
      width:100%; background:var(--bg); border:1px solid var(--border); border-radius:4px;
      padding:9px 13px; color:var(--text); font-size:14px; font-family:var(--mono);
      outline:none; transition:border-color .2s; resize:vertical;
    }
    .field input:focus,.field textarea:focus,.field select:focus { border-color:var(--blue); }
    .field .sub { font-size:11px; color:var(--text-dim); margin-top:4px; font-family:var(--mono); }

    .btn { display:inline-block; padding:9px 20px; border-radius:4px; cursor:pointer; font-family:var(--sans); font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; border:none; transition:all .2s; text-decoration:none !important; }
    .btn:hover { text-decoration:none !important; opacity:.9; }
    .btn-primary { background:linear-gradient(135deg,var(--green),var(--blue)); color:var(--bg); }
    .btn-secondary { background:var(--bg3); border:1px solid var(--border2); color:var(--blue); }
    .btn-secondary:hover { border-color:var(--blue); }
    .btn-danger { background:var(--bg3); border:1px solid #3a1a1a; color:var(--red); }
    .btn-danger:hover { border-color:var(--red); }
    .btn-sm { padding:5px 12px; font-size:12px; }

    .error-box { background:rgba(255,68,85,.08); border:1px solid var(--red); border-radius:4px; padding:10px 14px; color:#ff8899; font-family:var(--mono); font-size:13px; margin-bottom:1rem; }
    .success-box { background:rgba(0,255,136,.07); border:1px solid rgba(0,255,136,.4); border-radius:4px; padding:10px 14px; color:var(--green); font-family:var(--mono); font-size:13px; margin-bottom:1rem; }

    .pyr-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; padding:1.5rem 0; }
    .pyr-row  { display:flex; gap:10px; }
    .stone {
      width:128px; height:86px; border-radius:6px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; position:relative;
      border:1px solid transparent; padding:8px; transition:all .22s; text-decoration:none !important;
    }
    .stone:hover { text-decoration:none !important; }
    .stone-locked    { background:#0b1018; border-color:#141d2a; opacity:.45; cursor:not-allowed; pointer-events:none; }
    .stone-available { background:#0d1a28; border-color:#1d3a5a; cursor:pointer; }
    .stone-available:hover { border-color:var(--blue); transform:translateY(-2px); box-shadow:0 4px 18px rgba(0,180,255,.14); }
    .stone-partial   { background:#0c1d1e; border-color:#1a4035; cursor:pointer; }
    .stone-partial:hover { border-color:var(--green); transform:translateY(-2px); }
    .stone-complete  { background:#091810; border-color:var(--green); cursor:pointer; }
    .stone-complete:hover { transform:translateY(-2px); box-shadow:0 4px 18px rgba(0,255,136,.18); }
    .stone-id   { font-family:var(--mono); font-size:9px; color:#243040; position:absolute; top:5px; left:7px; }
    .stone-icon { font-size:20px; margin-bottom:3px; }
    .stone-lbl  { font-size:11px; font-weight:700; letter-spacing:1px; text-align:center; line-height:1.3; }
    .stone-locked .stone-lbl    { color:#243040; }
    .stone-available .stone-lbl { color:var(--blue); }
    .stone-partial .stone-lbl   { color:#00d4a0; }
    .stone-complete .stone-lbl  { color:var(--green); }
    .stone-bar { position:absolute; bottom:5px; left:7px; right:7px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
    .stone-bar-fill { height:100%; border-radius:2px; }
    .stone-complete .stone-bar-fill { background:var(--green); }
    .stone-partial  .stone-bar-fill { background:var(--blue); }

    .ch-content { color:#8ab0d0; line-height:1.7; }
    .ch-content img { max-width:100%; border-radius:6px; margin:.5rem 0; }
    .ch-content p { margin-bottom:.5rem; }
    .ch-content h3,.ch-content h4 { color:var(--blue); font-family:var(--mono); margin:.75rem 0 .25rem; }
    .ch-content code { font-family:var(--mono); font-size:12px; color:#00d4a0; background:var(--bg2); border:1px solid var(--border); border-radius:3px; padding:1px 6px; }
    .ch-placeholder { color:var(--yellow); font-family:var(--mono); font-size:12px; border:1px dashed var(--yellow); border-radius:5px; padding:.75rem 1rem; }

    .answer-label { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; margin-bottom:4px; }
    .answer-input { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:4px; padding:9px 13px; color:var(--text); font-family:var(--mono); font-size:14px; outline:none; transition:border-color .2s; }
    .answer-input:focus { border-color:var(--blue); }
    .answer-input.ok    { border-color:var(--green) !important; }
    .answer-input.hint  { border-color:var(--yellow) !important; }
    .answer-input.wrong { border-color:var(--red)   !important; }
    .field-fb { font-family:var(--mono); font-size:12px; min-height:18px; }
    .field-fb.correct { color:var(--green); }
    .field-fb.hint    { color:var(--yellow); }
    .field-fb.wrong   { color:var(--red); }
    .check-btn { padding:9px 18px; background:var(--bg3); border:1px solid var(--border2); border-radius:4px; color:var(--blue); font-family:var(--sans); font-size:14px; font-weight:700; letter-spacing:1px; cursor:pointer; transition:all .2s; white-space:nowrap; }
    .check-btn:hover { border-color:var(--blue); }
    .check-btn:disabled { opacity:.4; cursor:not-allowed; }
    .solved-badge { color:var(--green); font-family:var(--mono); font-size:13px; }
    .stone-done-banner { background:rgba(0,255,136,.07); border:1px solid rgba(0,255,136,.3); border-radius:6px; padding:1rem 1.25rem; text-align:center; font-family:var(--mono); color:var(--green); font-size:14px; letter-spacing:1px; }

    .tbl { width:100%; border-collapse:collapse; font-size:14px; }
    .tbl th { font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); padding:8px 12px; border-bottom:1px solid var(--border2); text-align:left; }
    .tbl td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .tbl tr:last-child td { border-bottom:none; }
    .tbl tr:hover td { background:rgba(255,255,255,.02); }
    .badge { display:inline-block; font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:3px; }
    .badge-green  { color:var(--green);  border:1px solid rgba(0,255,136,.3); }
    .badge-blue   { color:var(--blue);   border:1px solid rgba(0,180,255,.3); }
    .badge-yellow { color:var(--yellow); border:1px solid rgba(255,180,0,.3); }
    .badge-dim    { color:var(--text-dim); border:1px solid var(--border); }
    .act { display:flex; gap:6px; flex-wrap:wrap; }

    .bc { font-family:var(--mono); font-size:12px; color:var(--dim); margin-bottom:1.5rem; }
    .bc a { color:var(--text-dim); }
    .bc span { color:var(--text); }
    .flex-between { display:flex; justify-content:space-between; align-items:center; }
    hr.div { border:none; border-top:1px solid var(--border); margin:1.25rem 0; }
    .mt1{margin-top:.5rem}.mt2{margin-top:1rem}.mt3{margin-top:1.5rem}

    @media(max-width:600px) {
      .stone{width:88px;height:70px;} .stone-lbl{font-size:10px;}
      .nav .nav-hide { display:none; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
{% if session.user_id %}
<header class="site-header">
  <a href="{{ url_for('home') }}" class="logo">
    <span class="k">K</span><span class="rest">onundrum</span>
  </a>
  <nav class="nav">
    <a href="{{ url_for('pyramid') }}" class="nav-hide">Piramide</a>
    <a href="{{ url_for('hall_of_fame') }}" class="nav-hide">Hall of Fame</a>
    <a href="{{ url_for('profile') }}" class="nav-hide">Stats</a>
    {% if session.is_admin %}
      <a href="{{ url_for('admin') }}" class="admin-badge">ADMIN</a>
    {% endif %}
    <span style="color:var(--text-dim)">{{ session.username }}</span>
    <form action="{{ url_for('logout') }}" method="get" style="margin:0">
      <button class="btn-logout" type="submit">↩</button>
    </form>
  </nav>
</header>
{% endif %}
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
