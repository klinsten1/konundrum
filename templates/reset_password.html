{% extends "base.html" %}
{% block title %}New password — Konundrum{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:380px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="font-family:var(--mono);font-size:30px;letter-spacing:4px;">
        <span style="color:var(--green)">K</span><span style="color:var(--blue)">onundrum</span>
      </div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:4px;">// set new password</div>
    </div>
    <div class="card">
      {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
      <form method="POST">
        <div class="field"><label>New password</label>
          <input type="password" name="password" placeholder="••••••••" autocomplete="new-password" required autofocus/>
          <div class="sub">Minimum 4 characters.</div>
        </div>
        <div class="field"><label>Confirm password</label>
          <input type="password" name="password2" placeholder="••••••••" autocomplete="new-password" required/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.25rem;">Save password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
